name: ARMSX2 Performance Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "platforms/android/**"
      - "pcsx2/**"
      - "common/**"
      - "3rdparty/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/armsx2-performance-apk.yml"

concurrency:
  group: armsx2-performance-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Universal ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            platforms/android/**/*.gradle*
            platforms/android/gradle/libs.versions.toml
            platforms/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Fetch shaderc dependencies
        working-directory: platforms/android
        shell: bash
        run: |
          python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Prepare Android build
        working-directory: platforms/android
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x tools/build-universal-page-apk.sh

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Build universal 4K + 16K APK
        working-directory: platforms/android
        shell: bash
        run: |
          ./tools/build-universal-page-apk.sh \
            --application-id com.thecrixux.armsx2performance \
            "$GITHUB_WORKSPACE/ARMSX2-Performance-Android-Universal.apk"

      - name: Verify APK
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/ARMSX2-Performance-Android-Universal.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          echo
          echo "Checking 4K + 16K cores:"
          unzip -l "$APK" | grep -E \
            "lib/arm64-v8a/libemucore_(4k|16k)\.so"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Performance-Android-Universal
          path: ARMSX2-Performance-Android-Universal.apk
          if-no-files-found: error
          compression-level: 0
